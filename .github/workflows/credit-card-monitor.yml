name: Credit Card Optimizer

on:
  schedule:
    # Runs every 6 hours to catch new offers
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-credit-card-updates:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4 python-dateutil
          
      - name: Fetch Credit Card Updates
        run: python scripts/parse_credit_card_feeds.py
        
      - name: Commit and push if changed
        run: |
          git config --global user.name 'Credit Card Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update credit card offers and tips - $(date +'%Y-%m-%d %H:%M:%S')" && git push)
