name: Credit Card Optimizer

on:
  schedule:
    # Runs every 6 hours to catch new offers
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-credit-card-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent runaway workflows
    
    # Cancel in-progress runs
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
    permissions:
      contents: write
      
    steps:
      # Security: Monitor network egress
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            www.cardexpert.in:443
            cardinsider.com:443
            1finance.co.in:443
            www.moneycontrol.com:443
            economictimes.indiatimes.com:443
            www.paisabazaar.com:443
            www.bankbazaar.com:443
            select.finology.in:443
      
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install feedparser python-dateutil
          
      - name: Fetch Credit Card Updates
        run: python scripts/parse_credit_card_feeds.py
        
      - name: Configure Git for GitHub Actions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        
      - name: Commit and push if changed
        run: |
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update credit card offers and tips - ${{ github.run_id }}" && git push)
