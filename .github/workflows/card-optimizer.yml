name: Credit Card Optimizer

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom credit card analysis query'
        required: false
        default: 'Compare the top 5 Indian credit cards for overall value in 2025, analyzing annual fees, reward rates, benefits, lounge access, and total annual value for different spending profiles'
      model:
        description: 'AI Model (all 100% FREE)'
        required: false
        default: 'meta-llama/llama-3.2-3b-instruct:free'
        type: choice
        options:
          - meta-llama/llama-3.2-3b-instruct:free
          - google/gemma-2-9b-it:free
          - qwen/qwen-2.5-7b-instruct:free
          - mistralai/mistral-7b-instruct:free
          - microsoft/phi-3-mini-128k-instruct:free
  schedule:
    - cron: "0 1 * * 1"  # Runs weekly on Monday at 6:30 AM IST (01:00 UTC)

jobs:
  card-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent runaway workflows
    
    # Cancel in-progress runs for same workflow
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
    # Minimal required permissions
    permissions:
      contents: write
      actions: read

    steps:
      # Security: Monitor network egress and harden runtime
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            openrouter.ai:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false  # Don't persist credentials

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.11"
          cache: 'pip'  # Enable pip caching

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run card analysis
        env:
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CUSTOM_PROMPT: ${{ github.event.inputs.prompt }}
          CUSTOM_MODEL: ${{ github.event.inputs.model || 'meta-llama/llama-3.2-3b-instruct:free' }}
          GITHUB_ACTIONS: true
        run: |
          echo "💳 Credit Card Optimizer - AI-Powered Recommendations"
          echo "🤖 AI Model: ${CUSTOM_MODEL}"
          echo "🔄 Auto-Fallback: Enabled (5 models available)"
          echo "💰 Query: ${CUSTOM_PROMPT}"
          echo ""
          python main.py

      - name: Commit and push recommendations
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git pull --rebase origin main || true
          
          git add recommendations/
          if git diff --staged --quiet; then
            echo "⚠️ No new card recommendations generated"
            exit 0
          else
            git commit -m "💳 Credit Card Analysis - $(date +'%Y-%m-%d %H:%M:%S UTC')"
            
            for i in {1..3}; do
              if git push; then
                echo "✅ Card recommendations published successfully!"
                exit 0
              else
                echo "⚠️ Push attempt $i failed, retrying..."
                git pull --rebase origin main
                sleep 2
              fi
            done
            
            echo "❌ Failed to push after 3 attempts"
            exit 1
          fi
