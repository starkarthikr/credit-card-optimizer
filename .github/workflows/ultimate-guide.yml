name: Generate Ultimate Reward Guide

on:
  workflow_dispatch:
  
jobs:
  generate-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent runaway workflows
    
    # Cancel in-progress runs
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
    permissions:
      contents: write

    steps:
      # Security: Monitor network egress
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            openrouter.ai:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false  # Don't persist credentials

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Ultimate Credit Card Guide
        env:
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_ACTIONS: true
        run: |
          echo "💳 Generating ULTIMATE Credit Card Reward Maximization Guide..."
          echo "This will take 60-90 seconds for comprehensive analysis..."
          python run_analysis.py

      - name: Commit and push guide
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git pull --rebase origin main || true
          
          git add recommendations/
          if git diff --staged --quiet; then
            echo "⚠️ No guide generated"
            exit 0
          else
            git commit -m "💳 Ultimate Credit Card Reward Maximization Guide - $(date +'%Y-%m-%d %H:%M:%S UTC')"
            
            for i in {1..3}; do
              if git push; then
                echo "✅ Ultimate guide published successfully!"
                echo ""
                echo "===========================================" 
                echo "Check recommendations/ folder for your comprehensive guide!"
                echo "==========================================="
                exit 0
              else
                echo "⚠️ Push attempt $i failed, retrying..."
                git pull --rebase origin main
                sleep 2
              fi
            done
            
            echo "❌ Failed to push after 3 attempts"
            exit 1
          fi
