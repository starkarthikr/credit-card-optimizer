name: Generate Ultimate Reward Guide

on:
  workflow_dispatch:
  
jobs:
  generate-guide:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Ultimate Credit Card Guide
        run: |
          echo "💳 Generating ULTIMATE Credit Card Reward Maximization Guide..."
          echo "This will take 60-90 seconds for comprehensive analysis..."
          python run_analysis.py

      - name: Commit and push guide
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git pull --rebase origin main || true
          
          git add recommendations/
          if git diff --staged --quiet; then
            echo "⚠️ No guide generated"
            exit 0
          else
            git commit -m "💳 Ultimate Credit Card Reward Maximization Guide - $(date +'%Y-%m-%d %H:%M:%S UTC')"
            
            for i in {1..3}; do
              if git push; then
                echo "✅ Ultimate guide published successfully!"
                echo ""
                echo "===========================================" 
                echo "Check recommendations/ folder for your comprehensive guide!"
                echo "==========================================="
                exit 0
              else
                echo "⚠️ Push attempt $i failed, retrying..."
                git pull --rebase origin main
                sleep 2
              fi
            done
            
            echo "❌ Failed to push after 3 attempts"
            exit 1
          fi
